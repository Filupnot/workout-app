AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated workout data and authentication
Parameters:
  AppOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  GoogleClientId:
    Type: String
  GoogleSecretArn:
    Type: String
    Description: Secrets Manager ARN with a clientSecret JSON field; value is never in Git
  OwnerParameter:
    Type: String
    Description: Existing SSM SecureString containing the admitted Cognito subject
  AuthDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9-]+'
Resources:
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byDate
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
  Pool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    Properties:
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameConfiguration: { CaseSensitive: false }
      UserPoolName: !Sub '${AWS::StackName}-users'
  Google:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref Pool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleSecretArn}:SecretString:clientSecret}}'
        authorize_scopes: openid
      AttributeMapping: { username: sub }
  Scope:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref Pool
      Identifier: workout
      Name: Workout
      Scopes:
        - { ScopeName: data, ScopeDescription: Access own workout records }
  Client:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: [Google, Scope]
    Properties:
      UserPoolId: !Ref Pool
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, workout/data]
      CallbackURLs: [!Sub '${AppOrigin}/auth/callback/']
      LogoutURLs: [!Sub '${AppOrigin}/']
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Pool
      Domain: !Ref AuthDomainPrefix
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../dist/backend/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref Data
          USER_POOL_ID: !Ref Pool
          CLIENT_ID: !Ref Client
          OWNER_PARAMETER: !Ref OwnerParameter
          APP_ORIGIN: !Ref AppOrigin
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
              Resource: [!GetAtt Data.Arn, !Sub '${Data.Arn}/index/*']
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OwnerParameter}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AppOrigin]
          AllowMethods: [GET, POST]
          AllowHeaders: [authorization, content-type]
          MaxAge: 300
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Api
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Api}'
      RetentionInDays: 14
Outputs:
  ApiUrl: { Value: !GetAtt ApiUrl.FunctionUrl }
  UserPoolId: { Value: !Ref Pool }
  ClientId: { Value: !Ref Client }
  Authority: { Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Pool}' }
  AuthDomain: { Value: !Sub 'https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
